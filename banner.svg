<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <defs>
    <style>
      @font-face { font-family: 'PS2P'; src: url(data:font/woff2;base64,) format('woff2'); }
      text { font-family: 'PS2P', 'Courier New', monospace; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.6" stop-color="#1d0b3f"/>
      <stop offset="1" stop-color="#43126b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.55" stop-color="#ff901f"/>
      <stop offset="1" stop-color="#ff2975"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="820" height="300" rx="24"/></clipPath>
    <clipPath id="sky-clip"><rect x="0" y="0" width="820" height="206"/></clipPath>
    <mask id="sun-slits">
      <circle cx="410" cy="206" r="82" fill="#fff"/>
      <rect x="310" y="168" width="200" height="3" fill="#000"/>
      <rect x="310" y="181" width="200" height="5" fill="#000"/>
      <rect x="310" y="195" width="200" height="7" fill="#000"/>
    </mask>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0d0221" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0d0221" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="300" fill="url(#sky)"/>

    <circle cx="60" cy="40" r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.0s" begin="-0.0s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="90" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="-0.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="30" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="60" r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" begin="-1.2000000000000002s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="25" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="50" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.0s" begin="-2.0s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="90" r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="-2.4000000000000004s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="-2.8000000000000003s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" begin="-3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" begin="-3.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="130" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.0s" begin="-4.0s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="160" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="-4.4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="150" r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="-4.800000000000001s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="130" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" begin="-5.2s" repeatCount="indefinite"/></circle>

    <!-- sun -->
    <g clip-path="url(#sky-clip)">
      <circle cx="410" cy="206" r="86" fill="#ff2975" filter="url(#neon)" opacity="0.6"/>
      <circle cx="410" cy="206" r="82" fill="url(#sun)" mask="url(#sun-slits)"/>
    </g>

    <!-- grid floor -->
    <rect x="0" y="206" width="820" height="94" fill="#12032a"/>
    <g stroke="#ff2fb3" stroke-width="1.3" opacity="0.5">
      <line x1="410" y1="206" x2="470" y2="300" />
      <line x1="410" y1="206" x2="350" y2="300" />
      <line x1="410" y1="206" x2="550" y2="300" />
      <line x1="410" y1="206" x2="270" y2="300" />
      <line x1="410" y1="206" x2="650" y2="300" />
      <line x1="410" y1="206" x2="170" y2="300" />
      <line x1="410" y1="206" x2="770" y2="300" />
      <line x1="410" y1="206" x2="50" y2="300" />
      <line x1="410" y1="206" x2="920" y2="300" />
      <line x1="410" y1="206" x2="-100" y2="300" />
      <line x1="410" y1="206" x2="1110" y2="300" />
      <line x1="410" y1="206" x2="-290" y2="300" />
      <line x1="410" y1="206" x2="1350" y2="300" />
      <line x1="410" y1="206" x2="-530" y2="300" />
      <line x1="410" y1="206" x2="1630" y2="300" />
      <line x1="410" y1="206" x2="-810" y2="300" />
    </g>
    <g>
      <line x1="0" y1="206" x2="820" y2="206" stroke="#ff2fb3" stroke-width="1.5" opacity="0">
        <animate attributeName="y1" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.85;0.5" keyTimes="0;0.2;0.85;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="206" x2="820" y2="206" stroke="#ff2fb3" stroke-width="1.5" opacity="0">
        <animate attributeName="y1" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.85;0.5" keyTimes="0;0.2;0.85;1" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="206" x2="820" y2="206" stroke="#ff2fb3" stroke-width="1.5" opacity="0">
        <animate attributeName="y1" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.85;0.5" keyTimes="0;0.2;0.85;1" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="206" x2="820" y2="206" stroke="#ff2fb3" stroke-width="1.5" opacity="0">
        <animate attributeName="y1" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-2.4000000000000004s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="207;212;219;229;243;262;286;300" keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1" dur="3.2s" begin="-2.4000000000000004s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.85;0.5" keyTimes="0;0.2;0.85;1" dur="3.2s" begin="-2.4000000000000004s" repeatCount="indefinite"/>
      </line>
    </g>
    <line x1="0" y1="206" x2="820" y2="206" stroke="#2de2e6" stroke-width="2.5" filter="url(#neon)" opacity="0.8"/>
    <line x1="0" y1="206" x2="820" y2="206" stroke="#9ff7f9" stroke-width="1.4"/>

    <!-- fog over the lower grid so the text below reads cleanly -->
    <rect x="0" y="214" width="820" height="86" fill="url(#fog)"/>

    <!-- arcade HUD -->
    <text x="28" y="36" font-size="11" fill="#2de2e6" opacity="0.85">PLAYER 1 - NICO THOMAS BERANEK</text>

    <!-- title: pink offset shadow + cyan front -->
    <text x="414" y="114" font-size="40" fill="#ff2fb3" text-anchor="middle" opacity="0.9">HELLO WORLD</text>
    <text x="410" y="110" font-size="40" fill="#f3fdfd" text-anchor="middle">HELLO WORLD</text>

    <!-- subtitle on the grid -->
    <text x="410" y="242" font-size="13" fill="#2de2e6" text-anchor="middle">SOFTWARE ENGINEER FROM AUSTRIA</text>
    <g shape-rendering="crispEdges">
      <rect x="622" y="230" width="21" height="5" fill="#ED2939"/>
      <rect x="622" y="235" width="21" height="4" fill="#ffffff"/>
      <rect x="622" y="239" width="21" height="5" fill="#ED2939"/>
    </g>

    <!-- arcade continue countdown -->
    <g>
      <text x="344" y="278" font-size="12" fill="#ffd319">CONTINUE?</text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="1">9<animate attributeName="opacity" values="1;0" keyTimes="0;0.1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">8<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.2" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">7<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.3" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">6<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.4" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">5<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">4<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">3<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.7" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
      <text x="464" y="278" font-size="12" fill="#ffd319" opacity="0">0<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.9;1.0" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
    </g>

    <!-- CRT overlays -->
    <rect width="820" height="300" fill="url(#scan)" opacity="0.22"/>
    <rect width="820" height="300" fill="url(#vignette)"/>
  </g>
</svg>

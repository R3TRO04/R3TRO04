<svg xmlns="http://www.w3.org/2000/svg" width="820" height="216" viewBox="0 0 820 216">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="820" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33BBFF"/>
      <stop offset="1" stop-color="#7733FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33BBFF"/>
      <stop offset="1" stop-color="#7733FF"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="820" height="216" rx="24"/>
    </clipPath>
    <clipPath id="flag">
      <rect x="48" y="142" width="34" height="23" rx="4"/>
    </clipPath>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="216" fill="#242938"/>

    <!-- soft gradient glows -->
    <circle cx="740" cy="20" r="180" fill="url(#glow)" opacity="0.28" filter="url(#soften)">
      <animate attributeName="opacity" values="0.28;0.42;0.28" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="230" r="120" fill="#7733FF" opacity="0.22" filter="url(#soften)">
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- dotted grid, right side -->
    <g fill="#ffffff" opacity="0.10">
      <g id="dotrow">
        <circle cx="560" cy="36" r="2"/><circle cx="588" cy="36" r="2"/><circle cx="616" cy="36" r="2"/><circle cx="644" cy="36" r="2"/><circle cx="672" cy="36" r="2"/><circle cx="700" cy="36" r="2"/><circle cx="728" cy="36" r="2"/><circle cx="756" cy="36" r="2"/><circle cx="784" cy="36" r="2"/>
      </g>
      <use href="#dotrow" y="28"/>
      <use href="#dotrow" y="56"/>
      <use href="#dotrow" y="84"/>
      <use href="#dotrow" y="112"/>
      <use href="#dotrow" y="140"/>
    </g>

    <!-- ghost code glyph -->
    <text x="636" y="196" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="110" font-weight="700" fill="#ffffff" opacity="0.06">&lt;/&gt;</text>

    <!-- headline -->
    <text x="48" y="100" font-family="-apple-system, 'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Hello World<tspan fill="#33BBFF" font-weight="700">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <!-- gradient underline -->
    <rect x="48" y="114" height="6" rx="3" fill="url(#accent)" width="210">
      <animate attributeName="width" values="210;260;210" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- austrian flag -->
    <g clip-path="url(#flag)">
      <rect x="48" y="142" width="34" height="8" fill="#ED2939"/>
      <rect x="48" y="150" width="34" height="7" fill="#ffffff"/>
      <rect x="48" y="157" width="34" height="8" fill="#ED2939"/>
    </g>

    <!-- subtitle -->
    <text x="94" y="161" font-family="-apple-system, 'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="22" font-weight="500" fill="#9aa4b2">Software Engineer from Austria</text>
  </g>
</svg>
